    <!-- ===== 內部版本號 =====
         每次更新遊戲（JS、CSS、圖片、音檔、影片有任何變動）就把 APP_VERSION 改成新的號碼。
         所有檔案的網址都會帶上 ?v=版本號，號碼一變就是新網址，玩家的瀏覽器和 GitHub Pages 的 CDN 都會重新下載；
         玩家拿到舊的 index.html 時，js/main.js 的 checkForNewVersion() 會發現並自動換成新版。
         sw.js 也跟著這個號碼：號碼一變，瀏覽器就會換新版的 sw.js。 -->
    <script>
        window.APP_VERSION = '1.0.21';

        // 網址加上 ?v=版本號（雙擊開檔 file:// 時不加：本機檔案不會被快取，加了反而可能讀不到）
        window.withVersion = function (url) {
            if (location.protocol === 'file:') return url;
            return url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + encodeURIComponent(window.APP_VERSION);
        };

        // 依序載入帶版本號的 CSS / JS（用 document.write 才會跟寫死的 <link>、<script> 一樣同步、照順序載入）
        window.loadVersioned = function (urls) {
            urls.forEach(function (url) {
                var src = window.withVersion(url);
                document.write(/\.css$/.test(url)
                    ? '<link rel="stylesheet" href="' + src + '">'
                    : '<script src="' + src + '"><\/script>');
            });
        };

        loadVersioned(['./css/style.css']);
    </script>
</head>

<body>

    <div id="game-wrapper">
        <!-- Phaser Game Canvas Mount -->
        <div id="phaser-container"></div>
    </div>

    <!-- 無法連線：玩到一半斷線時蓋在遊戲上（js/main.js 的 setupOfflineGuard()）；開啟時就沒網路的無法連線頁在 sw.js -->
    <div id="offline-overlay" class="offline" hidden>
        <h1>無法連線</h1>
        <p>街友本色 I 需要網路才能玩</p>
        <small>請確認網路連線，連上後會自動重新載入</small>
        <button type="button" class="comic-btn" onclick="location.reload()">重新連線</button>
    </div>

    <!-- 遊戲程式（依相依順序載入：音效 → 美術 → 資料 → 共用特效 → 各場景 → 啟動），網址自動帶版本號 -->
    <script>
        loadVersioned([
            './js/audio.js',
            './js/comic-art.js',
            './js/data.js',
            './js/fx.js',
            './js/share.js',
            './js/scenes/boot-scene.js',
            './js/scenes/cover-scene.js',
            './js/scenes/story-scene.js',
            './js/scenes/select-scene.js',
            './js/scenes/play-scene.js',
            './js/scenes/result-scene.js',
            './js/main.js'
        ]);
    </script>
</body>
